[project]
name = "finbot"
version = "0.1.0"
description = "LangChain stock research agent: BUY / HOLD / AVOID verdicts for US and Indian stocks"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "ddgs>=9.0",
    "streamlit>=1.40",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = ["live: hits the network (yfinance / DuckDuckGo)"]
